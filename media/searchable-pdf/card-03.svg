<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#FAF7EF" stroke="none" stroke-width="2"/><text x="76" y="79" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#07152E" text-anchor="start" letter-spacing="4"><tspan x="76" dy="0">HWANSEEK</tspan></text><text x="1004" y="77" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#187C79" text-anchor="end" letter-spacing="1.2"><tspan x="1004" dy="0">SEARCHABLE PDF</tspan></text><line x1="76" y1="113" x2="1004" y2="113" stroke="#D6DDD6" stroke-width="2"/><text x="76" y="172" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#187C79" text-anchor="start" letter-spacing="2"><tspan x="76" dy="0">DOCUMENTED APP STEPS</tspan></text><text x="76" y="279" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="700" fill="#07152E" text-anchor="start" letter-spacing="-2.4"><tspan x="76" dy="0">Make a searchable</tspan><tspan x="76" dy="92.02000000000001">PDF with NAPS2.</tspan></text><text x="80" y="491" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="400" fill="#52636B" text-anchor="start" letter-spacing="0"><tspan x="80" dy="0">Choose the language on the page.</tspan><tspan x="80" dy="49">Keep the original and save a new copy.</tspan></text><rect x="76" y="629" width="928" height="111" rx="20" fill="#FFFFFF" stroke="#D6DDD6" stroke-width="2"/><text x="116" y="704" font-family="Arial, Helvetica, sans-serif" font-size="55" font-weight="700" fill="#187C79" text-anchor="start" letter-spacing="0"><tspan x="116" dy="0">1</tspan></text><text x="205" y="674" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#07152E" text-anchor="start" letter-spacing="0"><tspan x="205" dy="0">Import the PDF</tspan></text><text x="205" y="713" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#52636B" text-anchor="start" letter-spacing="0"><tspan x="205" dy="0">Use a copy of the image-only document.</tspan></text><rect x="76" y="759" width="928" height="111" rx="20" fill="#FFFFFF" stroke="#D6DDD6" stroke-width="2"/><text x="116" y="834" font-family="Arial, Helvetica, sans-serif" font-size="55" font-weight="700" fill="#187C79" text-anchor="start" letter-spacing="0"><tspan x="116" dy="0">2</tspan></text><text x="205" y="804" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#07152E" text-anchor="start" letter-spacing="0"><tspan x="205" dy="0">Open OCR setup</tspan></text><text x="205" y="843" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#52636B" text-anchor="start" letter-spacing="0"><tspan x="205" dy="0">Select or download the right language.</tspan></text><rect x="76" y="889" width="928" height="111" rx="20" fill="#FFFFFF" stroke="#D6DDD6" stroke-width="2"/><text x="116" y="964" font-family="Arial, Helvetica, sans-serif" font-size="55" font-weight="700" fill="#187C79" text-anchor="start" letter-spacing="0"><tspan x="116" dy="0">3</tspan></text><text x="205" y="934" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#07152E" text-anchor="start" letter-spacing="0"><tspan x="205" dy="0">Enable searchable PDF</tspan></text><text x="205" y="973" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#52636B" text-anchor="start" letter-spacing="0"><tspan x="205" dy="0">Check “Make PDFs searchable using OCR”.</tspan></text><rect x="76" y="1019" width="928" height="111" rx="20" fill="#FFFFFF" stroke="#D6DDD6" stroke-width="2"/><text x="116" y="1094" font-family="Arial, Helvetica, sans-serif" font-size="55" font-weight="700" fill="#187C79" text-anchor="start" letter-spacing="0"><tspan x="116" dy="0">4</tspan></text><text x="205" y="1064" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#07152E" text-anchor="start" letter-spacing="0"><tspan x="205" dy="0">Save PDF, then check</tspan></text><text x="205" y="1103" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#52636B" text-anchor="start" letter-spacing="0"><tspan x="205" dy="0">Reopen it to search and copy the text.</tspan></text><line x1="76" y1="1212" x2="1004" y2="1212" stroke="#D6DDD6" stroke-width="2"/><text x="76" y="1254" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#52636B" text-anchor="start" letter-spacing="0"><tspan x="76" dy="0">Official app instructions · Our test used the console</tspan></text><text x="1004" y="1300" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#187C79" text-anchor="end" letter-spacing="0"><tspan x="1004" dy="0">03 / 05</tspan></text></svg>