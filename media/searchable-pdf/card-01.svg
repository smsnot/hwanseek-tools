<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#FAF7EF" stroke="none" stroke-width="2"/><text x="76" y="79" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#07152E" text-anchor="start" letter-spacing="4"><tspan x="76" dy="0">HWANSEEK</tspan></text><text x="1004" y="77" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#187C79" text-anchor="end" letter-spacing="1.2"><tspan x="1004" dy="0">SEARCHABLE PDF</tspan></text><line x1="76" y1="113" x2="1004" y2="113" stroke="#D6DDD6" stroke-width="2"/><text x="76" y="172" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#187C79" text-anchor="start" letter-spacing="2"><tspan x="76" dy="0">WHEN A PDF IS A PICTURE OF TEXT</tspan></text><text x="76" y="279" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="700" fill="#07152E" text-anchor="start" letter-spacing="-2.4"><tspan x="76" dy="0">The words are there.</tspan><tspan x="76" dy="83.46000000000001">Search finds nothing.</tspan></text><text x="80" y="486" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="400" fill="#52636B" text-anchor="start" letter-spacing="0"><tspan x="80" dy="0">A scanned PDF can contain page images.</tspan><tspan x="80" dy="49">OCR can add text that you can search.</tspan></text><rect x="76" y="624" width="928" height="230" rx="20" fill="#FFFFFF" stroke="#D6DDD6" stroke-width="2"/><text x="116" y="676" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#187C79" text-anchor="start" letter-spacing="1.2"><tspan x="116" dy="0">VISIBLE ON OUR PRACTICE PAGE</tspan></text><text x="116" y="747" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="400" fill="#07152E" text-anchor="start" letter-spacing="0"><tspan x="116" dy="0">Keep the cobalt notebook</tspan><tspan x="116" dy="54">beside the sample tray.</tspan></text><path d="M540,883 v42 m-12,-12 l12,12 l12,-12" fill="none" stroke="#187C79" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="76" y="967" width="928" height="174" rx="20" fill="#F3E9D6" stroke="none" stroke-width="2"/><text x="116" y="1024" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#956329" text-anchor="start" letter-spacing="1.5"><tspan x="116" dy="0">BEFORE OCR</tspan></text><text x="116" y="1091" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" fill="#07152E" text-anchor="start" letter-spacing="0"><tspan x="116" dy="0">No extractable text on either page.</tspan></text><line x1="76" y1="1212" x2="1004" y2="1212" stroke="#D6DDD6" stroke-width="2"/><text x="76" y="1254" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#52636B" text-anchor="start" letter-spacing="0"><tspan x="76" dy="0">Two-page image-only sample · Simplified diagram</tspan></text><text x="1004" y="1300" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#187C79" text-anchor="end" letter-spacing="0"><tspan x="1004" dy="0">01 / 05</tspan></text></svg>