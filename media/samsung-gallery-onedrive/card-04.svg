<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#FAF7EF" stroke="none" stroke-width="2"/><text x="76" y="79" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#07152E" text-anchor="start" letter-spacing="4"><tspan x="76" dy="0">HWANSEEK</tspan></text><text x="1004" y="77" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#187C79" text-anchor="end" letter-spacing="1.2"><tspan x="1004" dy="0">GALLERY + ONEDRIVE</tspan></text><line x1="76" y1="113" x2="1004" y2="113" stroke="#D6DDD6" stroke-width="2"/><text x="76" y="172" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#187C79" text-anchor="start" letter-spacing="2"><tspan x="76" dy="0">SET UP THE NEW BACKUP PATH</tspan></text><text x="76" y="279" font-family="Arial, Helvetica, sans-serif" font-size="104" font-weight="700" fill="#07152E" text-anchor="start" letter-spacing="-2.4"><tspan x="76" dy="0">Back up</tspan><tspan x="76" dy="111.28">the next photo.</tspan></text><text x="80" y="503" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="400" fill="#52636B" text-anchor="start" letter-spacing="0"><tspan x="80" dy="0">OneDrive profile → Camera backup.</tspan><tspan x="80" dy="49">Choose the right account before switching on.</tspan></text><rect x="76" y="650" width="928" height="142" rx="20" fill="#FFFFFF" stroke="#D6DDD6" stroke-width="2"/><text x="116" y="735" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" fill="#187C79" text-anchor="start" letter-spacing="0"><tspan x="116" dy="0">1</tspan></text><text x="205" y="704" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="#07152E" text-anchor="start" letter-spacing="0"><tspan x="205" dy="0">Check the account</tspan></text><text x="205" y="752" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#52636B" text-anchor="start" letter-spacing="0"><tspan x="205" dy="0">Use the OneDrive account you intend.</tspan></text><rect x="76" y="818" width="928" height="142" rx="20" fill="#FFFFFF" stroke="#D6DDD6" stroke-width="2"/><text x="116" y="903" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" fill="#187C79" text-anchor="start" letter-spacing="0"><tspan x="116" dy="0">2</tspan></text><text x="205" y="872" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="#07152E" text-anchor="start" letter-spacing="0"><tspan x="205" dy="0">Allow photo and video access</tspan></text><text x="205" y="920" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#52636B" text-anchor="start" letter-spacing="0"><tspan x="205" dy="0">Check the app’s media permissions.</tspan></text><rect x="76" y="986" width="928" height="142" rx="20" fill="#FFFFFF" stroke="#D6DDD6" stroke-width="2"/><text x="116" y="1071" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" fill="#187C79" text-anchor="start" letter-spacing="0"><tspan x="116" dy="0">3</tspan></text><text x="205" y="1040" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="#07152E" text-anchor="start" letter-spacing="0"><tspan x="205" dy="0">Check videos and folders</tspan></text><text x="205" y="1088" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#52636B" text-anchor="start" letter-spacing="0"><tspan x="205" dy="0">Verify video and device-folder settings.</tspan></text><line x1="76" y1="1212" x2="1004" y2="1212" stroke="#D6DDD6" stroke-width="2"/><text x="76" y="1254" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#52636B" text-anchor="start" letter-spacing="0"><tspan x="76" dy="0">Official-document guide · Not a hands-on Galaxy test</tspan></text><text x="1004" y="1300" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#187C79" text-anchor="end" letter-spacing="0"><tspan x="1004" dy="0">04 / 05</tspan></text></svg>