<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#FAF7EF" stroke="none" stroke-width="2"/><text x="76" y="79" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#07152E" text-anchor="start" letter-spacing="4"><tspan x="76" dy="0">HWANSEEK</tspan></text><text x="1004" y="77" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#187C79" text-anchor="end" letter-spacing="1.2"><tspan x="1004" dy="0">GALLERY + ONEDRIVE</tspan></text><line x1="76" y1="113" x2="1004" y2="113" stroke="#D6DDD6" stroke-width="2"/><text x="76" y="172" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#187C79" text-anchor="start" letter-spacing="2"><tspan x="76" dy="0">KEEP THE ORIGINALS YOU NEED</tspan></text><text x="76" y="279" font-family="Arial, Helvetica, sans-serif" font-size="93" font-weight="700" fill="#07152E" text-anchor="start" letter-spacing="-2.4"><tspan x="76" dy="0">Want photos in</tspan><tspan x="76" dy="99.51">Gallery or offline?</tspan></text><text x="80" y="492" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="400" fill="#52636B" text-anchor="start" letter-spacing="0"><tspan x="80" dy="0">Download the originals to your phone.</tspan><tspan x="80" dy="49">A cloud preview is not a local original.</tspan></text><rect x="76" y="636" width="928" height="142" rx="20" fill="#FFFFFF" stroke="#D6DDD6" stroke-width="2"/><text x="116" y="721" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" fill="#187C79" text-anchor="start" letter-spacing="0"><tspan x="116" dy="0">1</tspan></text><text x="205" y="690" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="#07152E" text-anchor="start" letter-spacing="0"><tspan x="205" dy="0">Choose what you need</tspan></text><text x="205" y="738" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#52636B" text-anchor="start" letter-spacing="0"><tspan x="205" dy="0">Check available phone storage first.</tspan></text><rect x="76" y="804" width="928" height="142" rx="20" fill="#FFFFFF" stroke="#D6DDD6" stroke-width="2"/><text x="116" y="889" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" fill="#187C79" text-anchor="start" letter-spacing="0"><tspan x="116" dy="0">2</tspan></text><text x="205" y="858" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="#07152E" text-anchor="start" letter-spacing="0"><tspan x="205" dy="0">Download from OneDrive</tspan></text><text x="205" y="906" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#52636B" text-anchor="start" letter-spacing="0"><tspan x="205" dy="0">Save the selected original photos.</tspan></text><rect x="76" y="972" width="928" height="142" rx="20" fill="#FFFFFF" stroke="#D6DDD6" stroke-width="2"/><text x="116" y="1057" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" fill="#187C79" text-anchor="start" letter-spacing="0"><tspan x="116" dy="0">3</tspan></text><text x="205" y="1026" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="#07152E" text-anchor="start" letter-spacing="0"><tspan x="205" dy="0">Open a saved photo offline</tspan></text><text x="205" y="1074" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#52636B" text-anchor="start" letter-spacing="0"><tspan x="205" dy="0">Confirm that the file is on your phone.</tspan></text><line x1="76" y1="1212" x2="1004" y2="1212" stroke="#D6DDD6" stroke-width="2"/><text x="76" y="1254" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#52636B" text-anchor="start" letter-spacing="0"><tspan x="76" dy="0">Official-document guide · Not a hands-on Galaxy test</tspan></text><text x="1004" y="1300" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#187C79" text-anchor="end" letter-spacing="0"><tspan x="1004" dy="0">03 / 05</tspan></text></svg>