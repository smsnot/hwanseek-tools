<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#FAF7EF" stroke="none" stroke-width="2"/><text x="76" y="79" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#07152E" text-anchor="start" letter-spacing="4"><tspan x="76" dy="0">HWANSEEK</tspan></text><text x="1004" y="77" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#187C79" text-anchor="end" letter-spacing="1.2"><tspan x="1004" dy="0">SHIFT CALENDAR REVIEW</tspan></text><line x1="76" y1="113" x2="1004" y2="113" stroke="#D6DDD6" stroke-width="2"/><text x="76" y="172" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#187C79" text-anchor="start" letter-spacing="2"><tspan x="76" dy="0">A FILE IS A SNAPSHOT</tspan></text><text x="76" y="279" font-family="Arial, Helvetica, sans-serif" font-size="91" font-weight="700" fill="#07152E" text-anchor="start" letter-spacing="-2.4"><tspan x="76" dy="0">Import into a</tspan><tspan x="76" dy="97.37">separate calendar.</tspan></text><text x="80" y="492" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="400" fill="#52636B" text-anchor="start" letter-spacing="0"><tspan x="80" dy="0">Choose the destination deliberately.</tspan><tspan x="80" dy="49">Then inspect what actually arrived.</tspan></text><rect x="76" y="630" width="928" height="142" rx="20" fill="#FFFFFF" stroke="#D6DDD6" stroke-width="2"/><text x="116" y="715" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#187C79" text-anchor="start" letter-spacing="0"><tspan x="116" dy="0">1</tspan></text><text x="204" y="684" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="#07152E" text-anchor="start" letter-spacing="0"><tspan x="204" dy="0">Download after reviewing the row</tspan></text><text x="204" y="731" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#52636B" text-anchor="start" letter-spacing="0"><tspan x="204" dy="0">In Google Calendar, import on a computer.</tspan></text><rect x="76" y="807" width="928" height="142" rx="20" fill="#FFFFFF" stroke="#D6DDD6" stroke-width="2"/><text x="116" y="892" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#187C79" text-anchor="start" letter-spacing="0"><tspan x="116" dy="0">2</tspan></text><text x="204" y="861" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="#07152E" text-anchor="start" letter-spacing="0"><tspan x="204" dy="0">Check the imported dates and times</tspan></text><text x="204" y="908" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#52636B" text-anchor="start" letter-spacing="0"><tspan x="204" dy="0">Include first, last, overnight, and OFF days.</tspan></text><rect x="76" y="984" width="928" height="174" rx="20" fill="#F3E9D6" stroke="none" stroke-width="2"/><text x="116" y="1041" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" fill="#956329" text-anchor="start" letter-spacing="0"><tspan x="116" dy="0">A revised roster is not a live update.</tspan></text><text x="116" y="1101" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#956329" text-anchor="start" letter-spacing="0"><tspan x="116" dy="0">Do not assume reimport replaces old shifts.</tspan></text><line x1="76" y1="1212" x2="1004" y2="1212" stroke="#D6DDD6" stroke-width="2"/><text x="76" y="1254" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#52636B" text-anchor="start" letter-spacing="0"><tspan x="76" dy="0">Synthetic examples · Verify against your roster</tspan></text><text x="1004" y="1300" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#187C79" text-anchor="end" letter-spacing="0"><tspan x="1004" dy="0">05 / 05</tspan></text></svg>