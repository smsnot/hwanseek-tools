<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#FAF7EF" stroke="none" stroke-width="2"/><text x="76" y="79" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#07152E" text-anchor="start" letter-spacing="4"><tspan x="76" dy="0">HWANSEEK</tspan></text><text x="1004" y="77" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#187C79" text-anchor="end" letter-spacing="1.2"><tspan x="1004" dy="0">SHIFT CALENDAR REVIEW</tspan></text><line x1="76" y1="113" x2="1004" y2="113" stroke="#D6DDD6" stroke-width="2"/><text x="76" y="172" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#187C79" text-anchor="start" letter-spacing="2"><tspan x="76" dy="0">KEEP EACH DAY IN ITS PLACE</tspan></text><text x="76" y="279" font-family="Arial, Helvetica, sans-serif" font-size="96" font-weight="700" fill="#07152E" text-anchor="start" letter-spacing="-2.4"><tspan x="76" dy="0">Blank cells</tspan><tspan x="76" dy="102.72">still have dates.</tspan></text><text x="80" y="494" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="400" fill="#52636B" text-anchor="start" letter-spacing="0"><tspan x="80" dy="0">An empty cell is unresolved information.</tspan><tspan x="80" dy="49">Do not delete it and move later shifts.</tspan></text><rect x="76" y="650" width="928" height="238" rx="20" fill="#FFFFFF" stroke="#D6DDD6" stroke-width="2"/><text x="116" y="701" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#187C79" text-anchor="start" letter-spacing="1"><tspan x="116" dy="0">A SIMPLIFIED PART OF ONE MONTH</tspan></text><rect x="116" y="738" width="256" height="109" rx="20" fill="#E4EFEB" stroke="none" stroke-width="2"/><text x="244" y="777" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#52636B" text-anchor="middle" letter-spacing="0"><tspan x="244" dy="0">DAY 9</tspan></text><text x="244" y="824" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#07152E" text-anchor="middle" letter-spacing="0"><tspan x="244" dy="0">N</tspan></text><rect x="412" y="738" width="256" height="109" rx="20" fill="#F3E9D6" stroke="none" stroke-width="2"/><text x="540" y="777" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#956329" text-anchor="middle" letter-spacing="0"><tspan x="540" dy="0">DAY 10</tspan></text><text x="540" y="824" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#956329" text-anchor="middle" letter-spacing="0"><tspan x="540" dy="0">?</tspan></text><rect x="708" y="738" width="256" height="109" rx="20" fill="#E4EFEB" stroke="none" stroke-width="2"/><text x="836" y="777" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#52636B" text-anchor="middle" letter-spacing="0"><tspan x="836" dy="0">DAY 11</tspan></text><text x="836" y="824" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#07152E" text-anchor="middle" letter-spacing="0"><tspan x="836" dy="0">OFF</tspan></text><rect x="76" y="940" width="928" height="216" rx="20" fill="#E4EFEB" stroke="none" stroke-width="2"/><text x="116" y="999" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#07152E" text-anchor="start" letter-spacing="0"><tspan x="116" dy="0">Resolve day 10 in place.</tspan></text><text x="116" y="1060" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="400" fill="#52636B" text-anchor="start" letter-spacing="0"><tspan x="116" dy="0">Check the source for its real code.</tspan><tspan x="116" dy="43">An OFF day still keeps its date.</tspan></text><line x1="76" y1="1212" x2="1004" y2="1212" stroke="#D6DDD6" stroke-width="2"/><text x="76" y="1254" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#52636B" text-anchor="start" letter-spacing="0"><tspan x="76" dy="0">Synthetic examples · Verify against your roster</tspan></text><text x="1004" y="1300" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#187C79" text-anchor="end" letter-spacing="0"><tspan x="1004" dy="0">02 / 05</tspan></text></svg>