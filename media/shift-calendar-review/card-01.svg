<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#FAF7EF" stroke="none" stroke-width="2"/><text x="76" y="79" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#07152E" text-anchor="start" letter-spacing="4"><tspan x="76" dy="0">HWANSEEK</tspan></text><text x="1004" y="77" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#187C79" text-anchor="end" letter-spacing="1.2"><tspan x="1004" dy="0">SHIFT CALENDAR REVIEW</tspan></text><line x1="76" y1="113" x2="1004" y2="113" stroke="#D6DDD6" stroke-width="2"/><text x="76" y="172" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#187C79" text-anchor="start" letter-spacing="2"><tspan x="76" dy="0">YOUR SHIFT ROW → CALENDAR FILE</tspan></text><text x="76" y="279" font-family="Arial, Helvetica, sans-serif" font-size="81" font-weight="700" fill="#07152E" text-anchor="start" letter-spacing="-2.4"><tspan x="76" dy="0">One monthly row.</tspan><tspan x="76" dy="86.67">Dates you can check.</tspan></text><text x="80" y="486" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="400" fill="#52636B" text-anchor="start" letter-spacing="0"><tspan x="80" dy="0">Paste your own complete month.</tspan><tspan x="80" dy="49">Keep every day attached to its code.</tspan></text><rect x="76" y="630" width="928" height="142" rx="20" fill="#FFFFFF" stroke="#D6DDD6" stroke-width="2"/><text x="116" y="715" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#187C79" text-anchor="start" letter-spacing="0"><tspan x="116" dy="0">1</tspan></text><text x="204" y="684" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="#07152E" text-anchor="start" letter-spacing="0"><tspan x="204" dy="0">Choose month + work time zone</tspan></text><text x="204" y="731" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#52636B" text-anchor="start" letter-spacing="0"><tspan x="204" dy="0">Use the zone where the shift happens.</tspan></text><rect x="76" y="807" width="928" height="142" rx="20" fill="#FFFFFF" stroke="#D6DDD6" stroke-width="2"/><text x="116" y="892" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#187C79" text-anchor="start" letter-spacing="0"><tspan x="116" dy="0">2</tspan></text><text x="204" y="861" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="#07152E" text-anchor="start" letter-spacing="0"><tspan x="204" dy="0">Paste daily cells, including days off</tspan></text><text x="204" y="908" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#52636B" text-anchor="start" letter-spacing="0"><tspan x="204" dy="0">Leave names, totals, and other rows out.</tspan></text><rect x="76" y="984" width="928" height="142" rx="20" fill="#FFFFFF" stroke="#D6DDD6" stroke-width="2"/><text x="116" y="1069" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#187C79" text-anchor="start" letter-spacing="0"><tspan x="116" dy="0">3</tspan></text><text x="204" y="1038" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="#07152E" text-anchor="start" letter-spacing="0"><tspan x="204" dy="0">Review dates before downloading</tspan></text><text x="204" y="1085" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#52636B" text-anchor="start" letter-spacing="0"><tspan x="204" dy="0">Use an employer calendar export if available.</tspan></text><line x1="76" y1="1212" x2="1004" y2="1212" stroke="#D6DDD6" stroke-width="2"/><text x="76" y="1254" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#52636B" text-anchor="start" letter-spacing="0"><tspan x="76" dy="0">Synthetic examples · Verify against your roster</tspan></text><text x="1004" y="1300" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#187C79" text-anchor="end" letter-spacing="0"><tspan x="1004" dy="0">01 / 05</tspan></text></svg>