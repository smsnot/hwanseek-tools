<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#FAF7EF" stroke="none" stroke-width="2"/><text x="76" y="79" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#07152E" text-anchor="start" letter-spacing="4"><tspan x="76" dy="0">HWANSEEK</tspan></text><text x="1004" y="77" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#187C79" text-anchor="end" letter-spacing="1.2"><tspan x="1004" dy="0">PROMPT ANONYMIZER</tspan></text><line x1="76" y1="113" x2="1004" y2="113" stroke="#D6DDD6" stroke-width="2"/><text x="76" y="172" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#187C79" text-anchor="start" letter-spacing="2"><tspan x="76" dy="0">DETECTION MISSES</tspan></text><text x="76" y="279" font-family="Arial, Helvetica, sans-serif" font-size="89" font-weight="700" fill="#07152E" text-anchor="start" letter-spacing="-2.4"><tspan x="76" dy="0">Some text still</tspan><tspan x="76" dy="95.23">gets through.</tspan></text><text x="80" y="456" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="400" fill="#52636B" text-anchor="start" letter-spacing="0"><tspan x="80" dy="0">Our English model missed both examples.</tspan><tspan x="80" dy="49">These are unchanged test outputs.</tspan></text><rect x="76" y="588" width="928" height="211" rx="20" fill="#FFFFFF" stroke="#D6DDD6" stroke-width="2"/><text x="116" y="640" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#187C79" text-anchor="start" letter-spacing="1.2"><tspan x="116" dy="0">LOWERCASE NAMES</tspan></text><text x="116" y="702" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="400" fill="#07152E" text-anchor="start" letter-spacing="0"><tspan x="116" dy="0">Customer mara ellison asked</tspan><tspan x="116" dy="53">riley north to reply.</tspan></text><rect x="76" y="830" width="928" height="211" rx="20" fill="#FFFFFF" stroke="#D6DDD6" stroke-width="2"/><text x="116" y="882" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#187C79" text-anchor="start" letter-spacing="1.2"><tspan x="116" dy="0">QUOTED EMAIL ADDRESS</tspan></text><text x="116" y="944" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="400" fill="#07152E" text-anchor="start" letter-spacing="0"><tspan x="116" dy="0">Reply to &quot;riley north&quot;@example.com</tspan><tspan x="116" dy="53">about the invented project.</tspan></text><rect x="76" y="1080" width="928" height="88" rx="20" fill="#F3E9D6" stroke="none" stroke-width="2"/><text x="112" y="1135" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#07152E" text-anchor="start" letter-spacing="0"><tspan x="112" dy="0">No entities detected. The text was still visible.</tspan></text><line x1="76" y1="1212" x2="1004" y2="1212" stroke="#D6DDD6" stroke-width="2"/><text x="76" y="1254" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#52636B" text-anchor="start" letter-spacing="0"><tspan x="76" dy="0">Local core test · English NER + regex · No GUI or LLM test</tspan></text><text x="1004" y="1300" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#187C79" text-anchor="end" letter-spacing="0"><tspan x="1004" dy="0">02 / 05</tspan></text></svg>