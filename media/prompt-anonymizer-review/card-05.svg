<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#FAF7EF" stroke="none" stroke-width="2"/><text x="76" y="79" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#07152E" text-anchor="start" letter-spacing="4"><tspan x="76" dy="0">HWANSEEK</tspan></text><text x="1004" y="77" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#187C79" text-anchor="end" letter-spacing="1.2"><tspan x="1004" dy="0">PROMPT ANONYMIZER</tspan></text><line x1="76" y1="113" x2="1004" y2="113" stroke="#D6DDD6" stroke-width="2"/><text x="76" y="172" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#187C79" text-anchor="start" letter-spacing="2"><tspan x="76" dy="0">REMOVE A STEP BEFORE ADDING A TOOL</tspan></text><text x="76" y="279" font-family="Arial, Helvetica, sans-serif" font-size="89" font-weight="700" fill="#07152E" text-anchor="start" letter-spacing="-2.4"><tspan x="76" dy="0">Skip the</tspan><tspan x="76" dy="95.23">customer details.</tspan></text><text x="80" y="456" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="400" fill="#52636B" text-anchor="start" letter-spacing="0"><tspan x="80" dy="0">When identity adds nothing to the task,</tspan><tspan x="80" dy="49">leave it out of the prompt.</tspan></text><rect x="76" y="588" width="928" height="207" rx="20" fill="#FFFFFF" stroke="#D6DDD6" stroke-width="2"/><text x="116" y="640" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#187C79" text-anchor="start" letter-spacing="1.2"><tspan x="116" dy="0">IF YOU USE THE ANONYMIZER</tspan></text><text x="116" y="704" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#07152E" text-anchor="start" letter-spacing="0"><tspan x="116" dy="0">One job. One mapping.</tspan></text><text x="116" y="758" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="400" fill="#52636B" text-anchor="start" letter-spacing="0"><tspan x="116" dy="0">Review the masked text and the restored text.</tspan></text><rect x="76" y="830" width="928" height="250" rx="20" fill="#E4EFEB" stroke="none" stroke-width="2"/><text x="116" y="882" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#187C79" text-anchor="start" letter-spacing="1.2"><tspan x="116" dy="0">OR ASK FOR A REUSABLE TEMPLATE</tspan></text><text x="116" y="946" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#07152E" text-anchor="start" letter-spacing="0"><tspan x="116" dy="0">Keep customer details out.</tspan><tspan x="116" dy="53">Fill names locally after the reply.</tspan></text><text x="116" y="1048" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#52636B" text-anchor="start" letter-spacing="0"><tspan x="116" dy="0">No mapping or restoration in the AI exchange.</tspan></text><text x="80" y="1151" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#52636B" text-anchor="start" letter-spacing="0"><tspan x="80" dy="0">Process proposal · not timed or measured.</tspan></text><line x1="76" y1="1212" x2="1004" y2="1212" stroke="#D6DDD6" stroke-width="2"/><text x="76" y="1254" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#52636B" text-anchor="start" letter-spacing="0"><tspan x="76" dy="0">Local core test · English NER + regex · No GUI or LLM test</tspan></text><text x="1004" y="1300" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#187C79" text-anchor="end" letter-spacing="0"><tspan x="1004" dy="0">05 / 05</tspan></text></svg>