<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#FAF7EF" stroke="none" stroke-width="2"/><text x="76" y="79" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#07152E" text-anchor="start" letter-spacing="4"><tspan x="76" dy="0">HWANSEEK</tspan></text><text x="1004" y="77" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#187C79" text-anchor="end" letter-spacing="1.2"><tspan x="1004" dy="0">PROMPT ANONYMIZER</tspan></text><line x1="76" y1="113" x2="1004" y2="113" stroke="#D6DDD6" stroke-width="2"/><text x="76" y="172" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#187C79" text-anchor="start" letter-spacing="2"><tspan x="76" dy="0">THE LATEST MAPPING REPLACES THE LAST</tspan></text><text x="76" y="279" font-family="Arial, Helvetica, sans-serif" font-size="84" font-weight="700" fill="#07152E" text-anchor="start" letter-spacing="-2.4"><tspan x="76" dy="0">Keep one job</tspan><tspan x="76" dy="89.88000000000001">with one mapping.</tspan></text><text x="80" y="456" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="400" fill="#52636B" text-anchor="start" letter-spacing="0"><tspan x="80" dy="0">We reused one RestoreSession.</tspan><tspan x="80" dy="49">The old output acquired the new email.</tspan></text><rect x="76" y="582" width="928" height="148" rx="20" fill="#FFFFFF" stroke="#D6DDD6" stroke-width="2"/><text x="116" y="628" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#187C79" text-anchor="start" letter-spacing="1.2"><tspan x="116" dy="0">1  MASK THE FIRST DOCUMENT</tspan></text><text x="116" y="689" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#07152E" text-anchor="start" letter-spacing="0"><tspan x="116" dy="0">Write to mara.ellison@example.com.</tspan></text><rect x="76" y="752" width="928" height="148" rx="20" fill="#FFFFFF" stroke="#D6DDD6" stroke-width="2"/><text x="116" y="798" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#187C79" text-anchor="start" letter-spacing="1.2"><tspan x="116" dy="0">2  MASK A SECOND DOCUMENT</tspan></text><text x="116" y="859" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#07152E" text-anchor="start" letter-spacing="0"><tspan x="116" dy="0">Write to riley.north@example.com.</tspan></text><rect x="76" y="922" width="928" height="169" rx="20" fill="#F3E9D6" stroke="none" stroke-width="2"/><text x="116" y="968" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#956329" text-anchor="start" letter-spacing="1.2"><tspan x="116" dy="0">3  RESTORE THE FIRST OUTPUT</tspan></text><text x="116" y="1030" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#07152E" text-anchor="start" letter-spacing="0"><tspan x="116" dy="0">Write to riley.north@example.com.</tspan></text><text x="80" y="1154" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#187C79" text-anchor="start" letter-spacing="0"><tspan x="80" dy="0">Wrong address. Zero unresolved labels.</tspan></text><line x1="76" y1="1212" x2="1004" y2="1212" stroke="#D6DDD6" stroke-width="2"/><text x="76" y="1254" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#52636B" text-anchor="start" letter-spacing="0"><tspan x="76" dy="0">Local core session test · Synthetic data · No GUI or LLM test</tspan></text><text x="1004" y="1300" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#187C79" text-anchor="end" letter-spacing="0"><tspan x="1004" dy="0">04 / 05</tspan></text></svg>