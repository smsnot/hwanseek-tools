<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#FAF7EF" stroke="none" stroke-width="2"/><text x="76" y="79" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#07152E" text-anchor="start" letter-spacing="4"><tspan x="76" dy="0">HWANSEEK</tspan></text><text x="1004" y="77" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#187C79" text-anchor="end" letter-spacing="1.2"><tspan x="1004" dy="0">PROMPT ANONYMIZER</tspan></text><line x1="76" y1="113" x2="1004" y2="113" stroke="#D6DDD6" stroke-width="2"/><text x="76" y="172" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#187C79" text-anchor="start" letter-spacing="2"><tspan x="76" dy="0">AN EXISTING TOOL, PUT TO THE TEST</tspan></text><text x="76" y="279" font-family="Arial, Helvetica, sans-serif" font-size="88" font-weight="700" fill="#07152E" text-anchor="start" letter-spacing="-2.4"><tspan x="76" dy="0">Masked does not</tspan><tspan x="76" dy="94.16000000000001">mean safe.</tspan></text><text x="80" y="457" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="400" fill="#52636B" text-anchor="start" letter-spacing="0"><tspan x="80" dy="0">We tested Prompt Anonymizer locally</tspan><tspan x="80" dy="49">with invented names and email addresses.</tspan></text><rect x="76" y="595" width="928" height="205" rx="20" fill="#E4EFEB" stroke="none" stroke-width="2"/><text x="116" y="647" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#187C79" text-anchor="start" letter-spacing="1.2"><tspan x="116" dy="0">WORKED IN OUR SAMPLES</tspan></text><text x="116" y="708" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" fill="#07152E" text-anchor="start" letter-spacing="0"><tspan x="116" dy="0">Repeated names and emails</tspan><tspan x="116" dy="53">kept consistent labels.</tspan></text><rect x="76" y="835" width="928" height="247" rx="20" fill="#FFFFFF" stroke="#D6DDD6" stroke-width="2"/><text x="116" y="887" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#187C79" text-anchor="start" letter-spacing="1.2"><tspan x="116" dy="0">FAILED IN OTHER SAMPLES</tspan></text><text x="116" y="950" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#07152E" text-anchor="start" letter-spacing="0"><tspan x="116" dy="0">Text missed. Surnames exposed.</tspan><tspan x="116" dy="56">Wrong values restored.</tspan></text><text x="80" y="1144" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#187C79" text-anchor="start" letter-spacing="0"><tspan x="80" dy="0">A masked result still needs a careful read.</tspan></text><line x1="76" y1="1212" x2="1004" y2="1212" stroke="#D6DDD6" stroke-width="2"/><text x="76" y="1254" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#52636B" text-anchor="start" letter-spacing="0"><tspan x="76" dy="0">Local core test · English NER + regex · No GUI or LLM test</tspan></text><text x="1004" y="1300" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#187C79" text-anchor="end" letter-spacing="0"><tspan x="1004" dy="0">01 / 05</tspan></text></svg>